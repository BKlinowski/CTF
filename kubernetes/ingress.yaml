apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  labels:
    ingress: MainIngress
spec:
  ingressClassName: nginx
  rules:
    - host: ctf.local
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: backend
                port:
                  number: 80
